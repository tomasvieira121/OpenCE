# OpenAL Soft Configuration File (alsoft.ini)
#
# Place this file in the same directory as halo.exe (or %APPDATA%\alsoft.ini)
# to configure OpenAL Soft 3D spatialization, HRTF, speaker layouts, and resamplers.
# For full options reference, visit: https://github.com/kcat/openal-soft/blob/master/alsoftrc.sample

[general]
channels=stereo
stereo-mode=headphones
stereo-encoding=hrtf
hrtf-mode = full
resampler = bsinc12
